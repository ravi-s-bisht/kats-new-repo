name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - demo-avatarx
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - demo-avatarx

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'
          
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          CI: false
          NEXT_PUBLIC_BASE_URL: "/api"
          DAILY_BOTS_URL: "https://api.daily.co/v1/bots/start"
          NEXT_PUBLIC_ELEVENLABS_API_KEY: "sk_fd2fef69c65db8fedd846d97a3422ee4d2bd679dbf3560b3"
          DAILY_BOTS_API_KEY: "92e708e415167c293d27ec44eb844a047bded8ebe9e5f38681d81d0e1e2ddd2c"
          NEXT_PUBLIC_API_URL: "https://avatarx-server-staging.blueforest-1fbd7736.southindia.azurecontainerapps.io/api"
          NEXT_PUBLIC_SOCKET_URL: "https://avatarx-server-staging.blueforest-1fbd7736.southindia.azurecontainerapps.io"
          NEXT_PUBLIC_GOOGLE_LOGIN_API_KEY: "118420081966-s1n42272jcg4r5l4erufahti23ubp8o0.apps.googleusercontent.com"
          NODE_ENV: "staging"
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_CLIFF_047FDE510 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_CLIFF_047FDE510 }}
          action: "close"
